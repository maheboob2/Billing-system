services:
  # 1. 24/7 Cloud Sync Web API & POS Remote Reporting Gateway
  - type: web
    name: billing-cloud-api
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: CLOUD_SYNC_API_KEY
        generateValue: true

  # 2. 24/7 Always-On Telegram Bot Daemon (Runs even when local shop PC is closed)
  - type: worker
    name: billing-telegram-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py run_telegram_bot
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        fromService:
          type: web
          name: billing-cloud-api
          envVarKey: SECRET_KEY
      - key: TELEGRAM_BOT_TOKEN
        sync: false

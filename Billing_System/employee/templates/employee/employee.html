{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>employee management system</h1>
    <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
     

     <label>Username</label>
     <input type="text" name="username" required> <br><br>

     <label>First Name</label>
     <input type="text" name="first_name" required><br><br>

     <label>Last Name</label>
     <input type="text" name="last_name" required><br> <br>

     <label>Password</label>
     <input type="password" name="password" required> <br> <br> 

     <label>Confirm Password</label>
     <input type="password" name="confirm_pass" required> <br> <br>



     

      <label>profile Pic</label>
     <input type="file" name="profile_pic" required><br> <br>

      <label>Gender</label>
    <select name="Gender">
    <option value="Male">Male</option>
    <option value="Female">Female</option>
    <option value="Other">Other</option>
</select>

      <label>Phone</label>
     <input type="text" name="Phone" required><br> <br>

      <label>Alternate Number</label>
     <input type="text" name="Alternate_phone" required><br> <br>

      <label> Address</label>
     <input type="text" name="address" required><br> <br>

      <label>Employee Id</label>
     <input type="text" name="employee_id" required><br> <br>

      <label>Role</label>
      <select name="Role">
    <option value="Manager">Manager</option>
    <option value="Cashier">Cashier</option>
    <option value="Worker">Worker</option>
</select> <br><br>

      <label>Joining Date</label>
     <input type="date" name="joining_date" required><br> <br>

      <label> Monthaly_salary</label>
     <input type="text" name="monthaly_salary" required><br> <br>

     <label>Payment</label>
     <select name="payment">
    <option value="Paid">Paid</option>
    <option value="Unpaid">Unpaid</option>
    <option value="Due">Due</option> <br> <br>
</select> <br> <br>

    <label>Status</label>
     <select name="status">
    <option value="active">Active</option>
    <option value="inactive">Inactive</option>
</select> <br> <br>







     

    

     <button type="submit">Add Employee</button>

    </form>
</body>
</html>

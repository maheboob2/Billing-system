{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing System</title>
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; margin: 0; background: #f8fafc; }
        .nav-bar { background: #1e293b; color: white; padding: 12px 20px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        .nav-bar a { color: #cbd5e1; text-decoration: none; padding: 6px 12px; border-radius: 4px; font-size: 14px; }
        .nav-bar a:hover { background: #334155; color: white; }
        .nav-brand { font-weight: bold; color: white; margin-right: 15px; font-size: 16px; }
    </style>
</head>
<body>
    <div class="nav-bar">
        <span class="nav-brand"><i class="bi bi-receipt-cutoff"></i> Retail POS</span>
        <a href="{% url 'dashboard' %}"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="{% url 'sales' %}"><i class="bi bi-cart3"></i> Sales & Invoices</a>
        <a href="{% url 'product' %}"><i class="bi bi-box-seam"></i> Products</a>
        <a href="{% url 'category' %}"><i class="bi bi-tags"></i> Categories</a>
        <a href="{% url 'supplier' %}"><i class="bi bi-truck"></i> Suppliers</a>
        <a href="{% url 'purchase_list' %}"><i class="bi bi-bag-check"></i> Purchases</a>
        <a href="{% url 'view_employee' %}"><i class="bi bi-people"></i> Staff</a>
        <a href="/api/docs/" target="_blank"><i class="bi bi-code-slash"></i> API</a>
        <a href="{% url 'logout' %}" style="margin-left: auto; color: #f87171;"><i class="bi bi-box-arrow-right"></i> Logout</a>
    </div>

    {% block content %}
    
    {% endblock content %}

    {% include "dashboard/form_submit_protection.html" %}
</body>
</html>
